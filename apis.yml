aid: lido-finance
name: Lido Finance
description: >-
  Lido is a liquid staking protocol for Ethereum, live since 2020, that lets holders stake ETH
  without running validator infrastructure and receive stETH — a rebasing ERC-20 liquid staking
  token that accrues staking rewards while remaining transferable and usable as collateral across
  DeFi. wstETH is the non-rebasing wrapped form. The protocol is governed by the Lido DAO and
  operated by a curated and permissionless (CSM) set of node operators, with on-chain accounting,
  oracles, a withdrawal queue, and staking vaults (stVaults) introduced in Lido V3. For developers,
  Lido publishes a set of strictly read-only public REST APIs — the Lido Ethereum API (protocol and
  stETH APR, prices, stats, swap rates), the Withdrawals API (withdrawal queue wait-time estimation,
  withdrawal NFT metadata, gas estimation, validator info), and the Reward History Backend (per-address
  stETH interactions and daily reward accounting) — alongside a GraphQL subgraph on The Graph, the
  Lido Ethereum SDK for TypeScript, a Python SDK, and a React UI component library.
