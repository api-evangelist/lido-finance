description: >-
  Lido publishes no dated changelog for the three public REST APIs — each service exposes only an
  OpenAPI info.version (eth-api 0.18.0, withdrawals 0.26.0, reward-history 0.17.2). The maintained,
  structured changelog in the Lido developer surface is the Lido Ethereum SDK's CHANGELOG.md, which
  is the record captured here. Protocol-level changes are announced on blog.lido.fi and through
  Lido Improvement Proposals.
