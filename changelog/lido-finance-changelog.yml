entries:
- version: 4.8.0
  breaking: false
  highlights:
  - All contract instances support .encode and .prepare for encoding calls and preparing transactions without sending them.
  - All ABIs exported with their types, optimized for TypeScript performance.
  - Aligned with viem naming conventions — publicClient/walletClient replace rpcProvider/signerProvider.
  - Older methods marked for deprecation but still supported for backward compatibility.
  - Removed @ethersproject/bytes dependency in favour of viem utils.
- version: 4.7.0
  breaking: false
  highlights:
  - Added the StVault module.
  - New shares methods including convertBatchSharesToSteth, getSharesByPooledEth, getPooledEthByShares.
  - Updated stVault ABIs (StakingVault, VaultHub, VaultFactory, Dashboard, PredepositGuarantee, OperatorGrid, LazyOracle).
- version: 4.6.0
  breaking: false
  highlights:
  - wrapEth migrated from direct ETH transfers to calling stakeETH on the WstETHReferralStaker contract.
  - wrapEth supports an optional referralAddress parameter.
- version: 4.5.0
  breaking: false
  highlights:
  - Added the Dual Governance module.
- version: 4.4.0
  breaking: false
  highlights:
  - Added Hoodi testnet support.
- version: 4.3.0
  breaking: false
  highlights:
  - Added Unichain and UnichainSepolia L2 chain support.
- version: 4.2.0
  breaking: true
  highlights:
  - Added Soneium and SoneiumMinato as separate L2 chains.
  - Removed the Goerli chain.
- version: 4.1.0
  breaking: false
  highlights:
  - Gas-estimation helpers added across stake, wrap, withdraw and L2 modules.
  - TransactionCallback can now be async and is awaited; SIGN stage can return a custom gas limit.
  - requestWithdrawalWithPermit accepts a custom deadline for the permit signature.
